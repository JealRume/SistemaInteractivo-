<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Dinámica del DOM con Local Storage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background-color: #007bff; color: white; }
        button:hover { background-color: #0056b3; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .btn-eliminar { background-color: #dc3545; }
        .btn-eliminar:hover { background-color: #bd2130; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lista de Notas</h2>
        <p>Escribe una nota, agrégala a la lista y persistirá incluso si recargas la página.</p>
        
        <div class="input-group">
            <!-- TASK 1: Input y Botón de agregar -->
            <input type="text" id="inputNota" placeholder="Escribe una nota aquí...">
            <button id="btnAgregar">Agregar</button>
        </div>

        <!-- TASK 1: Lista para renderizar elementos -->
        <ul id="listaNotas"></ul>
    </div>

    <!-- Vinculación del script de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
